name: Release Morphe bundle
on:
  push:
    paths:
      - bundles/Nesquiks-patches-*.mpp
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, e.g. 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mapfile -t bundles < <(git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" -- 'bundles/Nesquiks-patches-*.mpp')
            if [[ ${#bundles[@]} == 0 ]]; then
              # A workflow-only push can retry publication of a bundle already on main.
              version=$(git ls-files 'bundles/Nesquiks-patches-*.mpp' |
                sed -nE 's|^bundles/Nesquiks-patches-([0-9]+\.[0-9]+\.[0-9]+)\.mpp$|\1|p' |
                sort -V | tail -1)
              current=$(python3 -c 'import json; print(json.load(open("patches-bundle.json"))["version"])')
              if [[ -z "$version" || "$version" == "$current" ]]; then
                exit 0
              fi
            elif [[ ${#bundles[@]} == 1 && ${bundles[0]} =~ ^bundles/Nesquiks-patches-([0-9]+\.[0-9]+\.[0-9]+)\.mpp$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo "A release push must add exactly one versioned Morphe bundle." >&2
              exit 1
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: env.VERSION != ''
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and catalog the patches
        if: env.VERSION != ''
        run: |
          if [[ -f "bundles/Nesquiks-patches-$VERSION.mpp" ]]; then
            python3 tools/fetch-toolchain.py .toolchain morphe.jar
            mkdir -p dist
            cp "bundles/Nesquiks-patches-$VERSION.mpp" "dist/Nesquiks-patches-$VERSION.mpp"
          else
            python3 tools/fetch-toolchain.py .toolchain
            tools/build-collection.sh "$VERSION" .toolchain
          fi
          java -jar .toolchain/morphe.jar list-patches --with-packages --with-versions \
            --patches "dist/Nesquiks-patches-$VERSION.mpp" > "dist/patches-list-$VERSION.txt"
          (cd dist && sha256sum "Nesquiks-patches-$VERSION.mpp" > "SHA256SUMS-$VERSION.txt")
      - name: Create release and update Morphe metadata
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Nesquiks-patches-$VERSION.mpp"
          gh release create "v$VERSION" \
            "dist/$asset" "dist/patches-list-$VERSION.txt" "dist/SHA256SUMS-$VERSION.txt" \
            --title "Nesquik's patches $VERSION" --generate-notes --target "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          name = f"Nesquiks-patches-{version}.mpp"
          metadata = {
              "version": version,
              "download_url": f"https://github.com/{repo}/releases/download/v{version}/{name}",
              "created_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": "Nesquik's patches for X, Reddit, YouTube, Firefox and Discord.",
          }
          Path("patches-bundle.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json
          git commit -m "Update Morphe source to $VERSION"
          git push
